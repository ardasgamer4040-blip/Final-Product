name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "StudyQuest-updated/studyquest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify project files
        run: |
          test -f package.json || (echo "ERROR: package.json not found in project folder" && exit 1)
          test -f scripts/admob-bridge.js || (echo "ERROR: AdMob bridge file not found" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Bundle native AdMob bridge
        run: npx esbuild scripts/admob-bridge.js --bundle --platform=browser --format=iife --outfile=www/admob-bridge.js

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add AdMob App ID
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(p)
          root = tree.getroot()

          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)

          app_id = 'ca-app-pub-5129021458262508~7820023458'

          application = root.find('application')
          if application is None:
              raise RuntimeError('No <application> element found in AndroidManifest.xml')

          name_attr = f'{{{android_ns}}}name'
          value_attr = f'{{{android_ns}}}value'
          key = 'com.google.android.gms.ads.APPLICATION_ID'

          existing = next(
              (el for el in application.findall('meta-data')
               if el.get(name_attr) == key),
              None
          )

          if existing is None:
              existing = ET.SubElement(application, 'meta-data')
              existing.set(name_attr, key)

          existing.set(value_attr, app_id)
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print('AdMob App ID configured successfully.')
          PY



      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studyquest-debug-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

