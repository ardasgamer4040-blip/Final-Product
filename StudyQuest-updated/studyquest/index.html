/* Layout: single phone-width column, bottom tab bar, game-style chunky buttons. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#151B2B; --mute:#68708A; --line:#E1E5EF;
  --accent:#FF5A36; --accent-deep:#C93A1A; --on-accent:#FFFFFF;
  --good:#12A66A; --good-bg:#DDF5EA; --bad:#E5484D; --bad-bg:#FDE3E4; --xp:#F2A900;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#181D2F; --ink:#EEF1F9; --mute:#98A1BA; --line:#2A3250;
  --accent:#FF6B48; --accent-deep:#B8381B; --on-accent:#1A0B07;
  --good:#3DD68C; --good-bg:#12372B; --bad:#FF6B70; --bad-bg:#40191C; --xp:#FFC53D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#181D2F; --ink:#EEF1F9; --mute:#98A1BA; --line:#2A3250;
  --accent:#FF6B48; --accent-deep:#B8381B; --on-accent:#1A0B07;
  --good:#3DD68C; --good-bg:#12372B; --bad:#FF6B70; --bad-bg:#40191C; --xp:#FFC53D; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-width:0}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
textarea{resize:vertical;min-height:96px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
.app{max-width:480px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .r{display:flex;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;min-height:38px}
.chip.fire{color:var(--accent)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px}
.motive{display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--xp) 18%,var(--surface));border-color:color-mix(in srgb,var(--xp) 45%,var(--line))}
.motive h3{font-size:22px;font-weight:800}
.lvl{display:flex;flex-direction:column;gap:12px}
.lvl-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lvl h2{font-size:34px;font-weight:800}
.small{font-size:13px;color:var(--mute);font-weight:500}
.bar{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);border-radius:999px;transition:width .5s}
.bar.g i{background:var(--good)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.goal{display:flex;flex-direction:column;gap:10px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{color:var(--accent);font-weight:700;min-height:36px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{--c:var(--accent);text-align:left;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:128px;justify-content:space-between;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile h3{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.tile .bar{height:10px;background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.tile .bar i{background:var(--c)}
.tile.new{background:transparent;border-style:dashed;border-color:var(--line);color:var(--mute);align-items:center;justify-content:center;font-weight:700}
.tile.cls{min-height:96px;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.alt:active{box-shadow:0 1px 0 var(--line)}
.btn.good{background:var(--good);color:#04230F;box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.small-btn{min-height:44px;font-size:15px;box-shadow:0 3px 0 var(--accent-deep)}
.btn.alt.small-btn{box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.nav div{max-width:480px;margin:0 auto;display:flex;gap:8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:14px;font-size:12px;font-weight:700;color:var(--mute)}
.nav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.back{display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:700;min-height:44px}
.hd{display:flex;align-items:center;gap:12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none}
.hd h1{font-size:30px;font-weight:800;overflow-wrap:anywhere}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.note{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.li div{flex:1;min-width:0;overflow-wrap:anywhere}
.li small{display:block;color:var(--mute)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--good)}
.x{width:40px;height:40px;border-radius:12px;color:var(--mute);display:flex;align-items:center;justify-content:center;flex:none}
.x:active{background:var(--bad-bg);color:var(--bad)}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.play{display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 40px)}
.ptop{display:flex;align-items:center;gap:8px}
.ptop .bar{flex:1}
.hearts{display:flex;gap:2px;color:var(--bad)}
.hearts .lost{opacity:.22}
.q{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.q h2{font-size:25px;font-weight:800;overflow-wrap:anywhere}
.q.shake{animation:shake .4s;border-color:var(--bad)}
.q.pop{animation:pop2 .35s;border-color:var(--good)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop2{50%{transform:scale(1.04)}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;min-height:56px;font-weight:500;box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere}
.opt span:last-child{min-width:0}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mute);flex:none}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt.dim{opacity:.55}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
.sheet.ok{background:var(--good-bg)}
.sheet.no{background:var(--bad-bg)}
.sheet>div{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px}
.sheet.ok h3{color:var(--good)}
.sheet.no h3{color:var(--bad)}
.sheet .sub{font-weight:500}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.flip{perspective:1000px;height:280px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:2px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;box-shadow:0 6px 0 var(--line)}
.face h2{font-size:25px;font-weight:800;overflow-wrap:anywhere}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.res{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;padding-top:24px}
.stars{display:flex;gap:8px;color:var(--line)}
.stars .on{color:var(--xp);animation:pop .5s both}
.stars .on:nth-child(2){animation-delay:.15s}.stars .on:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3)}to{transform:none}}
.res h1{font-size:36px;font-weight:800}
.res .line{font-size:18px;font-weight:500;max-width:30ch}
.big{font-family:var(--display);font-size:56px;font-weight:800;color:var(--xp);font-variant-numeric:tabular-nums;line-height:1}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px}
.bdg .ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--mute)}
.bdg.on .ic{background:var(--xp);color:#3A2800}
.bdg.off{opacity:.7}
.bdg b{font-family:var(--display);font-size:16px}
.bdg p{margin:0;font-size:13px;color:var(--mute)}
.toastrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{background:var(--xp);color:#3A2800;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>


<style id="studyquest-upgrade">

    if(c.d){S.opts=shuffle(c.d.concat([c.a]))}
    else{var pool=[];s.cards.forEach(function(x){if(x.a!==c.a&&pool.indexOf(x.a)<0)pool.push(x.a)});S.opts=shuffle(shuffle(pool).slice(0,3).concat([c.a]))}
  }
}
function reward(card,ok,xp){
  rollDay();card.box=ok?Math.min(4,card.box+1):Math.max(0,card.box-1);
  if(card.pk)st.prog[card.pk]=card.box;
  st.answered++;st.todayN++;bumpStreak();
  if(ok){st.xp+=xp;S.gain+=xp;S.right++}
  S.done++;
}
function play(){
  var s=find(S.sid),c=S.cards[S.i],pct=Math.round(S.i/S.cards.length*100),h='';
  for(var i=0;i<3;i++)h+='<span class="'+(i<S.lives?'':'lost')+'">'+ic('heart',22)+'</span>';
  var top='<div class="ptop"><button class="x" data-a="quit" aria-label="Quit round">'+ic('x',22)+'</button><div class="bar g"><i style="width:'+pct+'%"></i></div><button class="x" data-a="snd" aria-label="Toggle sound">'+ic(st.sound===false?'mute':'vol',20)+'</button><div class="hearts">'+h+'</div></div>';
  var label=esc(s.name)+(s.builtin?' · '+(st.cls===11?'UKG':'Class '+st.cls):'')+' · '+(S.i+1)+' of '+S.cards.length;
  if(S.mode==='quiz'){
    var ok=S.locked&&S.opts[S.picked]===c.a;
    var o=S.opts.map(function(t,i){var cl='opt';if(S.locked){if(t===c.a)cl+=' right';else if(i===S.picked)cl+=' wrong';else cl+=' dim'}return '<button class="'+cl+'" data-a="pick" data-v="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(t)+'</span></button>'}).join('');
    var sheet='';
    if(S.locked){sheet='<div class="sheet '+(ok?'ok':'no')+'"><div><h3>'+ic(ok?'check':'x',26)+esc(S.msg)+'</h3><div class="sub">'+(ok?'Correct! +'+S.lastXp+' XP'+(S.combo>1?' · '+S.combo+' in a row':''):'The answer is <b>'+esc(c.a)+'</b>')+'</div><button class="btn '+(ok?'good':'bad')+'" data-a="next">Continue</button></div></div>'}
    return '<div class="play">'+top+'<div class="eyebrow">'+label+'</div><div class="q'+(S.locked?(ok?' pop':' shake'):'')+'"><h2>'+esc(c.q)+'</h2></div><div class="opts">'+o+'</div></div>'+sheet;
  }
  var f='<div class="flip '+(S.flipped?'on':'')+'" style="--c:'+s.color+'" data-a="flipcard"><div class="in"><div class="face"><div class="eyebrow">Question</div><h2>'+esc(c.q)+'</h2><div class="small">Tap to reveal</div></div><div class="face back"><div class="eyebrow">Answer</div><h2>'+esc(c.a)+'</h2></div></div></div>';
  return '<div class="play">'+top+'<div class="eyebrow">'+label+'</div>'+f+
  (S.flipped?'<div class="row"><button class="btn bad" data-a="grade" data-v="0">Again</button><button class="btn good" data-a="grade" data-v="1">Got it</button></div>':'<div class="small" style="text-align:center">Think of the answer, then flip the card.</div>')+'</div>';
}
function starCount(){var acc=S.done?S.right/S.done:0;return acc>=.9?3:acc>=.6?2:S.right>0?1:0}
function finish(){
  var lv=lvl(st.xp).n;
  if(S.done>=5&&S.right===S.done)st.perfect++;
  var got=[];BADGES.forEach(function(b){if(st.badges.indexOf(b.id)<0&&b.t(st)){st.badges.push(b.id);got.push(b)}});
  S.newBadges=got;S.lvUp=lv>S.L0?lv:0;save();
  if(S.lvUp||got.length)sfx.level();else if(starCount()>=2)sfx.win();else sfx.tap();
  ui.screen='result';render();
}
function result(){
  var n=starCount(),stars='';
  for(var i=0;i<3;i++)stars+='<span class="'+(i<n?'on':'')+'">'+ic('star',48)+'</span>';
  var title=S.lives<=0?'Out of hearts':n===3?'Brilliant!':n===2?'Nice work':'Keep going';
  var line=n===3?'Topper! Aaj toh kamaal kar diya!':n===2?'Great effort! One more round and you will master it.':n===1?'Every champion started here. Practice karte raho!':'Don\'t give up. Himmat rakho and try again!';
  var tags=S.newBadges.map(function(b){return '<span class="tag">'+ic(b.i,16)+b.n+'</span>'}).join('');
  return '<div class="res"><div class="stars">'+stars+'</div><h1>'+title+'</h1><div class="line">'+line+'</div><div><div class="big">+'+S.gain+'</div><div class="small">XP earned</div></div>'+
  '<div class="stats" style="width:100%"><div class="stat"><span class="small">Correct</span><b>'+S.right+' / '+S.done+'</b></div><div class="stat"><span class="small">Streak</span><b>'+liveStreak()+' days</b></div></div>'+
  (S.lvUp?'<div class="tag">Level up! You are now level '+S.lvUp+'</div>':'')+(tags?'<div class="toastrow">'+tags+'</div>':'')+
  '<div style="width:100%;display:flex;flex-direction:column;gap:14px"><button class="btn" data-a="again">Play again</button><button class="btn alt" data-a="home">Done</button></div></div>';
}

function render(){
  var h;
  if(ui.screen==='play')h=play();
  else if(ui.screen==='result')h=result();
  else if(ui.screen==='newsub')h=newSub();
  else if(ui.screen==='class')h=classPick();
  else if(ui.screen&&ui.screen.indexOf('sub:')===0){var s=find(ui.screen.slice(4));h=s?subjectView(s):home()}
  else if(!st.cls)h=classPick();
  else if(ui.tab==='badges')h=badgesView();
  else if(ui.tab==='quests')h=questsView();
  else if(ui.tab==='profile')h=profileView();
  else if(ui.tab==='settings')h=settingsView();
  else h=home();
  app.innerHTML=h;document.documentElement.setAttribute('data-theme',st.theme||'light');document.documentElement.lang=st.lang||'en';document.documentElement.dir=st.lang==='ur'?'rtl':'ltr';
  window.scrollTo(0,0);
}

function buzz(n){try{if(navigator.vibrate)navigator.vibrate(n)}catch(e){}}
function go(scr){ui.screen=scr;ui.confirm=null;render()}
function checkBadges(){var got=[];BADGES.forEach(function(b){if(st.badges.indexOf(b.id)<0&&b.t(st)){st.badges.push(b.id);got.push(b)}});return got}

app.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  ac();
  if(a==='tab'){sfx.tap();ui.tab=v;ui.screen=null;ui.confirm=null;render()}
  else if(a==='snd'){st.sound=(st.sound===false);save();sfx.tap();render()}
  else if(a==='home'){sfx.tap();S=null;go(null)}
  else if(a==='class'){sfx.tap();go('class')}
  else if(a==='setcls'){var n=+v;if(!st.cls){changeClass(n)}else if(n===st.cls){ui.confirm=null;ui.screen=null;ui.tab='home';render()}else{ui.confirm='class:'+n;render()}}
  else if(a==='confirmclass'){changeClass(+v)}
  else if(a==='cancelclass'){ui.confirm=null;render()}
  else if(a==='theme'){st.theme=v==='dark'?'dark':'light';save();render()}
  else if(a==='savelang'){var ls=document.getElementById('langSelect');if(ls){st.lang=ls.value;save();render()}}
  else if(a==='saveprofile'){var pn=document.getElementById('profileName');if(pn){st.profile=st.profile||{};st.profile.name=pn.value.trim().slice(0,30)||'Learner';save();render()}}
  else if(a==='supportsubmit'){var sn=document.getElementById('supportName'),sc=document.getElementById('supportContact'),sm=document.getElementById('supportMessage');if(!sn||!sn.value.trim()||!sm||sm.value.trim().length<8){ui.supportMsg='Please enter your name and a message of at least 8 characters.';render();return}if(sc&&sc.value.trim()&&sc.value.indexOf('@')<0&&!/^[+0-9 ()-]{7,}$/.test(sc.value.trim())){ui.supportMsg='Enter a valid phone number or email address.';render();return}ui.supportMsg='Your fields look valid, but this app has no support server connected, so nothing was sent. Please call 9304287682 or 6205955077.';render()}
  else if(a==='notifications'){st.notifications=!st.notifications;save();render()}
  else if(a==='export'){exportData()} 
  else if(a==='open'){sfx.tap();go('sub:'+v)}
  else if(a==='newsub'){sfx.tap();go('newsub')}
  else if(a==='color'){ui.color=v;var t=document.getElementById('sn'),val=t?t.value:'';render();var t2=document.getElementById('sn');if(t2)t2.value=val}
  else if(a==='mksub'){
    var nm=document.getElementById('sn').value.trim();if(!nm){document.getElementById('sn').focus();return}
    var sub={id:uid(),name:nm,color:ui.color,cards:[]};st.subjects.push(sub);save();go('sub:'+sub.id)}
  else if(a==='addcard'){
    var q=document.getElementById('nq'),an=document.getElementById('na');
    if(!q.value.trim()){q.focus();return}if(!an.value.trim()){an.focus();return}
    find(v).cards.push({id:uid(),q:q.value.trim(),a:an.value.trim(),box:0});st.made++;
    checkBadges();save();sfx.ok(1);render();document.getElementById('nq').focus()}
  else if(a==='bulk'){
    var ta=document.getElementById('bulk'),cnt=0,sub2=find(v);
    ta.value.split('\n').forEach(function(line){var p=line.split('::');if(p.length<2)p=line.split('\t');if(p.length>=2&&p[0].trim()&&p[1].trim()){sub2.cards.push({id:uid(),q:p[0].trim(),a:p.slice(1).join('::').trim(),box:0});cnt++}});
    st.made+=cnt;checkBadges();save();if(cnt)sfx.ok(1);render()}
  else if(a==='delcard'){var sb=find(ui.screen.slice(4));sb.cards=sb.cards.filter(function(c){return c.id!==v});save();render()}
  else if(a==='delsub'){
    if(ui.confirm==='sub'+v){st.subjects=st.subjects.filter(function(s){return s.id!==v});save();go(null)}else{ui.confirm='sub'+v;render()}}
  else if(a==='reset'){
    if(ui.confirm==='reset'){var c0=st.cls,s0=st.sound,l0=st.lang,t0=st.theme,p0=st.profile;st=seed();st.cls=c0;st.sound=s0;st.lang=l0;st.theme=t0;st.profile=p0;save();ui.confirm=null;ui.tab='home';ui.screen=null;render()}else{ui.confirm='reset';render()}}
  else if(a==='quiz')startRound(v,'quiz');
  else if(a==='flip')startRound(v,'flip');
  else if(a==='again')startRound(S.sid,S.mode);
  else if(a==='quit'){if(S.done>0)finish();else{S=null;go(null)}}
  else if(a==='pick'){
    if(S.locked)return;var c=S.cards[S.i];S.picked=+v;S.locked=true;var ok=S.opts[S.picked]===c.a;
    if(ok){S.combo++;S.lastXp=10+2*Math.min(S.combo,5);reward(c,true,S.lastXp);buzz(15);sfx.ok(S.combo);
      S.msg=S.combo>=5?'Unstoppable! Topper material!':S.combo===3?'Teen mein teen! You are on fire!':pick(OK_LINES)}
    else{S.combo=0;S.lives--;reward(c,false,0);buzz([30,40,30]);sfx.no();S.msg=pick(NO_LINES)}
    save();render()}
  else if(a==='next'){
    sfx.tap();if(S.lives<=0||S.i>=S.cards.length-1)finish();else{S.i++;prep();render()}}
  else if(a==='flipcard'){sfx.tap();S.flipped=!S.flipped;el.classList.toggle('on',S.flipped);if(S.flipped&&!document.querySelector('[data-a=grade]'))showGrade()}
  else if(a==='grade'){
    var cc=S.cards[S.i],good=v==='1';if(good){S.combo++;sfx.ok(S.combo)}else{S.combo=0;S.lives--;sfx.no()}
    reward(cc,good,6);save();
    if(S.lives<=0||S.i>=S.cards.length-1)finish();else{S.i++;prep();render()}}
});
function showGrade(){
  /* keep the flipped card in place while adding the grade buttons */
  var tmp=document.createElement('div');tmp.innerHTML=play();
  var btns=tmp.querySelector('.row');var note=document.querySelector('.play>.small');
  if(note&&btns)note.replaceWith(btns);
}
render();
})();
</script>
